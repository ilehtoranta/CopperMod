name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      require_sid_accuracy:
        description: Run the required external SID evidence gate
        type: boolean
        default: false

jobs:
  sid-accuracy:
    if: github.event_name == 'workflow_dispatch' && inputs.require_sid_accuracy
    runs-on: [self-hosted, Windows, sid-evidence]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Require physical captures and pinned external reference
        shell: pwsh
        run: ./scripts/test-sid-accuracy.ps1 -EvidenceRoot $env:SID_HARDWARE_EVIDENCE_ROOT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sid-accuracy-results
          path: artifacts/sid-accuracy

  sid-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test SID digital timing and sampling
        run: dotnet test CopperMod.Sid.Core.Tests/CopperMod.Sid.Core.Tests.csproj --configuration Release --logger "trx;LogFileName=sid-core.trx" --results-directory artifacts/sid-core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sid-core-results
          path: artifacts/sid-core

  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack Copper68k NuGet
        shell: pwsh
        run: .\scripts\nuget\pack-copper68k.ps1

      - name: Test Copper68k
        env:
          COPPER68K_SYNTHETIC_REPORT_DIR: ${{ github.workspace }}/artifacts/synthetic-suite
        run: dotnet test Copper68k.Tests\Copper68k.Tests.csproj --configuration Release

      - name: Require complete synthetic milestone coverage
        shell: pwsh
        run: ./scripts/test-copper68k-synthetic.ps1 -ValidateReportsOnly -OutputDirectory artifacts/synthetic-suite

      - name: Upload synthetic architectural coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copper68k-synthetic-coverage
          path: artifacts/synthetic-suite

      - name: Test AHX shared Amiga dependency
        run: dotnet test CopperMod.Ahx.Tests\CopperMod.Ahx.Tests.csproj --configuration Release
