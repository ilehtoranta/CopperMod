name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack Copper68k NuGet
        shell: pwsh
        run: .\scripts\nuget\pack-copper68k.ps1

      - name: Test Copper68k
        run: dotnet test Copper68k.Tests\Copper68k.Tests.csproj --configuration Release

      - name: Test AHX shared Amiga dependency
        run: dotnet test CopperMod.Ahx.Tests\CopperMod.Ahx.Tests.csproj --configuration Release
