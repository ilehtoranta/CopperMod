name: Publish Copper68k approved tags

on:
  push:
    tags:
      - copper68k-v1.5.3
      - copper68k-v1.5.1
      - copper68k-v1.5.1-retry-1
      - copper68k-v1.5.1-retry-2
      - copper68k-v1.5.1-retry-3
      - copper68k-v1.5.0
      - copper68k-v1.5.0-retry-1
      - copper68k-v1.5.0-retry-2
      - copper68k-v1.5.0-retry-3
      - copper68k-v1.4.2-ocs020.52
      - copper68k-v1.4.2-ocs020.52-retry-1
      - copper68k-v1.4.2-ocs020.52-retry-2
      - copper68k-v1.4.2-ocs020.52-retry-3
      - copper68k-v1.4.2-ocs020.54
      - copper68k-v1.4.2-ocs020.54-retry-1
      - copper68k-v1.4.2-ocs020.54-retry-2
      - copper68k-v1.4.2-ocs020.54-retry-3

permissions: {}

concurrency:
  group: nuget-copper68k-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Select immutable package version for this release tag
        id: package
        shell: pwsh
        run: |
          $version = switch -Regex ($env:GITHUB_REF_NAME) {
            '^copper68k-v1\.5\.3$' { '1.5.3'; break }
            '^copper68k-v1\.5\.1(?:-retry-[1-3])?$' { '1.5.1'; break }
            '^copper68k-v1\.5\.0(?:-retry-[1-3])?$' { '1.5.0'; break }
            '^copper68k-v1\.4\.2-ocs020\.52(?:-retry-[1-3])?$' { '1.4.2-ocs020.52'; break }
            '^copper68k-v1\.4\.2-ocs020\.54(?:-retry-[1-3])?$' { '1.4.2-ocs020.54'; break }
            default { throw "Unrecognized Copper68k release tag: $env:GITHUB_REF_NAME" }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Run Copper68k CPU tests
        run: dotnet test Copper68k.Tests\Copper68k.Tests.csproj --configuration Release

      - name: Run AHX shared CPU consumer tests
        run: dotnet test CopperMod.Ahx.Tests\CopperMod.Ahx.Tests.csproj --configuration Release

      - name: Build and validate Copper68k packages
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: .\scripts\nuget\pack-copper68k.ps1 -Configuration Release -Version $env:PACKAGE_VERSION -SkipTests

      - name: Retain validated release packages
        uses: actions/upload-artifact@v4
        with:
          name: copper68k-release-packages
          path: |
            artifacts/packages/Copper68k.${{ steps.package.outputs.version }}.nupkg
            artifacts/packages/Copper68k.${{ steps.package.outputs.version }}.snupkg
          if-no-files-found: error

      - name: Exchange GitHub identity for a temporary NuGet API key
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ilehtoranta

      - name: Publish Copper68k package and symbols
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          $package = "artifacts/packages/Copper68k.$env:PACKAGE_VERSION.nupkg"
          $symbols = "artifacts/packages/Copper68k.$env:PACKAGE_VERSION.snupkg"
          if (-not (Test-Path -LiteralPath $package)) {
            throw "Validated NuGet package is missing."
          }
          if (-not (Test-Path -LiteralPath $symbols)) {
            throw "Validated NuGet symbol package is missing."
          }
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw "NuGet Trusted Publishing did not provide a temporary API key."
          }

          & dotnet nuget push $package --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --no-symbols --skip-duplicate
          if ($LASTEXITCODE -ne 0) {
            throw "Publishing the Copper68k package failed."
          }
          & dotnet nuget push $symbols --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          if ($LASTEXITCODE -ne 0) {
            throw "Publishing the Copper68k symbol package failed."
          }
